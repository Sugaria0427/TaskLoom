<svg xmlns="http://www.w3.org/2000/svg" style="background: #FAFBFE; background-color: light-dark(#FAFBFE, #141517);" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>TaskLoom · 项目思维导图</title><defs/><rect fill="#FAFBFE" width="100%" height="100%" x="0" y="0" style="fill: light-dark(rgb(250, 251, 254), rgb(20, 21, 23));"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="canvas"><g><rect x="0" y="0" width="1600" height="900" fill="#fafbfe" stroke="none" pointer-events="all" style="fill: light-dark(rgb(250, 251, 254), rgb(20, 21, 23));"/></g></g><g data-cell-id="title"><g><rect x="50" y="30" width="1500" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" font-weight="bold" text-anchor="start" font-size="42px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="50" y="80">TaskLoom · 项目思维导图</text></g></g></g><g data-cell-id="root"><g><rect x="620" y="391.03" width="360" height="167.77" rx="23.49" ry="23.49" fill="#edf1f6" stroke="#64748b" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(237, 241, 246), rgb(28, 31, 35)); stroke: light-dark(rgb(100, 116, 139), rgb(126, 140, 159));"/></g><g data-cell-id="root-title"><g><rect x="636" y="407.81" width="328" height="45.54" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" font-weight="bold" text-anchor="middle" font-size="31px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="800" y="445.08">TaskLoom「织序」</text></g></g></g><g data-cell-id="root-body"><g><rect x="636" y="462.93" width="328" height="83.88" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="26px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="800" y="501.38">让有限资源支撑</text><text x="800" y="532.38">完整任务的交付。</text></g></g></g></g><g data-cell-id="pain"><g><rect x="415" y="181.32" width="300" height="149.79" rx="20.97" ry="20.97" fill="#eaf0fd" stroke="#416bb4" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(234, 240, 253), rgb(27, 32, 43)); stroke: light-dark(rgb(65, 107, 180), rgb(115, 151, 214));"/></g><g data-cell-id="pain-title"><g><rect x="431" y="198.1" width="268" height="45.54" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" font-weight="bold" text-anchor="middle" font-size="25px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="565" y="232.37">为什么需要调度</text></g></g></g><g data-cell-id="pain-body"><g><rect x="431" y="253.22" width="268" height="65.91" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="22px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="565" y="283.18">并发任务需要竞争资源，</text><text x="565" y="309.18">独立重试也会争用额度。</text></g></g></g></g><g data-cell-id="scope"><g><rect x="885" y="181.32" width="300" height="149.79" rx="20.97" ry="20.97" fill="#f1ebfb" stroke="#7957a7" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(241, 235, 251), rgb(36, 31, 45)); stroke: light-dark(rgb(121, 87, 167), rgb(169, 140, 208));"/></g><g data-cell-id="scope-title"><g><rect x="901" y="198.1" width="268" height="45.54" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" font-weight="bold" text-anchor="middle" font-size="25px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="1035" y="232.37">系统在哪里介入</text></g></g></g><g data-cell-id="scope-body"><g><rect x="901" y="253.22" width="268" height="65.91" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="22px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="1035" y="283.18">个人端安排自己的任务，</text><text x="1035" y="309.18">平台端协调不同用户。</text></g></g></g></g><g data-cell-id="methods"><g><rect x="415" y="607.93" width="300" height="149.79" rx="20.97" ry="20.97" fill="#e4f4f0" stroke="#167c77" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(228, 244, 240), rgb(20, 34, 30)); stroke: light-dark(rgb(22, 124, 119), rgb(82, 169, 165));"/></g><g data-cell-id="methods-title"><g><rect x="431" y="624.71" width="268" height="45.54" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" font-weight="bold" text-anchor="middle" font-size="25px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="565" y="658.98">OS 方法怎样起作用</text></g></g></g><g data-cell-id="methods-body"><g><rect x="431" y="679.83" width="268" height="65.91" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="22px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="565" y="709.79">先判断工作是否就绪，</text><text x="565" y="735.79">再安全分配执行机会。</text></g></g></g></g><g data-cell-id="value"><g><rect x="885" y="607.93" width="300" height="149.79" rx="20.97" ry="20.97" fill="#fff2dd" stroke="#ad6c18" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 242, 221), rgb(38, 27, 9)); stroke: light-dark(rgb(173, 108, 24), rgb(187, 131, 58));"/></g><g data-cell-id="value-title"><g><rect x="901" y="624.71" width="268" height="45.54" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" font-weight="bold" text-anchor="middle" font-size="25px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="1035" y="658.98">怎样证明项目有效</text></g></g></g><g data-cell-id="value-body"><g><rect x="901" y="679.83" width="268" height="65.91" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="22px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="1035" y="709.79">保持模型与资源不变，</text><text x="1035" y="735.79">比较完整任务的交付。</text></g></g></g></g><g data-cell-id="pain-local"><g><rect x="60" y="125" width="320" height="105.45" rx="14.76" ry="14.76" fill="#ffffff" stroke="#416bb4" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(65, 107, 180), rgb(115, 151, 214));"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="23px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="220" y="174.23">工具争用 CPU、内存与文件，</text><text x="220" y="202.23">可能变慢、失败或留下残留。</text></g></g></g><g data-cell-id="branch-pain-local"><g><path d="M 415 256.22 L 398 256.22 L 398 177.73 L 380 177.73" fill="none" stroke="#416bb4" stroke-width="2.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(65, 107, 180), rgb(115, 151, 214));"/></g></g><g data-cell-id="pain-api"><g><rect x="60" y="302.36" width="320" height="105.45" rx="14.76" ry="14.76" fill="#ffffff" stroke="#416bb4" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(65, 107, 180), rgb(115, 151, 214));"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="23px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="220" y="351.58">各任务争抢同一份模型额度，</text><text x="220" y="379.58">短任务与后台任务容易失衡。</text></g></g></g><g data-cell-id="branch-pain-api"><g><path d="M 415 256.22 L 398 256.22 L 398 355.08 L 380 355.08" fill="none" stroke="#416bb4" stroke-width="2.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(65, 107, 180), rgb(115, 151, 214));"/></g></g><g data-cell-id="scope-local"><g><rect x="1220" y="125" width="320" height="105.45" rx="14.76" ry="14.76" fill="#ffffff" stroke="#7957a7" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(121, 87, 167), rgb(169, 140, 208));"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="23px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="1380" y="174.23">个人端管理工具、任务依赖，</text><text x="1380" y="202.23">以及模型请求的发送顺序。</text></g></g></g><g data-cell-id="branch-scope-local"><g><path d="M 1185 256.22 L 1202 256.22 L 1202 177.73 L 1220 177.73" fill="none" stroke="#7957a7" stroke-width="2.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(121, 87, 167), rgb(169, 140, 208));"/></g></g><g data-cell-id="scope-platform"><g><rect x="1220" y="302.36" width="320" height="105.45" rx="14.76" ry="14.76" fill="#ffffff" stroke="#7957a7" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(121, 87, 167), rgb(169, 140, 208));"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="23px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="1380" y="351.58">平台管理多用户请求的派发，</text><text x="1380" y="379.58">并向个人端反馈拥塞状态。</text></g></g></g><g data-cell-id="branch-scope-platform"><g><path d="M 1185 256.22 L 1202 256.22 L 1202 355.08 L 1220 355.08" fill="none" stroke="#7957a7" stroke-width="2.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(121, 87, 167), rgb(169, 140, 208));"/></g></g><g data-cell-id="methods-fair"><g><rect x="60" y="568.39" width="320" height="105.45" rx="14.76" ry="14.76" fill="#ffffff" stroke="#167c77" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(22, 124, 119), rgb(82, 169, 165));"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="23px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="220" y="617.62">列表调度、成本 DRR 与老化</text><text x="220" y="645.62">兼顾响应速度和持续推进。</text></g></g></g><g data-cell-id="branch-methods-fair"><g><path d="M 415 682.83 L 398 682.83 L 398 621.12 L 380 621.12" fill="none" stroke="#167c77" stroke-width="2.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(22, 124, 119), rgb(82, 169, 165));"/></g></g><g data-cell-id="methods-safe"><g><rect x="60" y="744.55" width="320" height="105.45" rx="14.76" ry="14.76" fill="#ffffff" stroke="#167c77" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(22, 124, 119), rgb(82, 169, 165));"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="23px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="220" y="793.77">原子准入、银行家检查与守护</text><text x="220" y="821.77">共同约束分配和异常清理。</text></g></g></g><g data-cell-id="branch-methods-safe"><g><path d="M 415 682.83 L 398 682.83 L 398 797.27 L 380 797.27" fill="none" stroke="#167c77" stroke-width="2.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(22, 124, 119), rgb(82, 169, 165));"/></g></g><g data-cell-id="value-experiment"><g><rect x="1220" y="568.39" width="320" height="105.45" rx="14.76" ry="14.76" fill="#ffffff" stroke="#ad6c18" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(173, 108, 24), rgb(187, 131, 58));"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="23px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="1380" y="617.62">对比基础、单端与协同方案，</text><text x="1380" y="645.62">检查按时合格完成率和等待。</text></g></g></g><g data-cell-id="branch-value-experiment"><g><path d="M 1185 682.83 L 1202 682.83 L 1202 621.12 L 1220 621.12" fill="none" stroke="#ad6c18" stroke-width="2.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(173, 108, 24), rgb(187, 131, 58));"/></g></g><g data-cell-id="value-month"><g><rect x="1220" y="744.55" width="320" height="105.45" rx="14.76" ry="14.76" fill="#ffffff" stroke="#ad6c18" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(173, 108, 24), rgb(187, 131, 58));"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="23px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="1380" y="793.77">使用实测结果校准月度仿真，</text><text x="1380" y="821.77">核对费用、公平性与残留。</text></g></g></g><g data-cell-id="branch-value-month"><g><path d="M 1185 682.83 L 1202 682.83 L 1202 797.27 L 1220 797.27" fill="none" stroke="#ad6c18" stroke-width="2.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(173, 108, 24), rgb(187, 131, 58));"/></g></g><g data-cell-id="root-pain"><g><path d="M 710 391.03 L 565 331.12" fill="none" stroke="#416bb4" stroke-width="2.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(65, 107, 180), rgb(115, 151, 214));"/></g></g><g data-cell-id="root-scope"><g><path d="M 890 391.03 L 1035 331.12" fill="none" stroke="#7957a7" stroke-width="2.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(121, 87, 167), rgb(169, 140, 208));"/></g></g><g data-cell-id="root-methods"><g><path d="M 710 558.8 L 565 607.93" fill="none" stroke="#167c77" stroke-width="2.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(22, 124, 119), rgb(82, 169, 165));"/></g></g><g data-cell-id="root-value"><g><path d="M 890 558.8 L 1035 607.93" fill="none" stroke="#ad6c18" stroke-width="2.2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(173, 108, 24), rgb(187, 131, 58));"/></g></g></g></g></g></svg>