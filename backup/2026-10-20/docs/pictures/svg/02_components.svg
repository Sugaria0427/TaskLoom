<svg xmlns="http://www.w3.org/2000/svg" style="background: #FAFBFE; background-color: light-dark(#FAFBFE, #141517);" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>TaskLoom · 两端四层组件图</title><defs/><rect fill="#FAFBFE" width="100%" height="100%" x="0" y="0" style="fill: light-dark(rgb(250, 251, 254), rgb(20, 21, 23));"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="canvas"><g><rect x="0" y="0" width="1600" height="1000" fill="#fafbfe" stroke="none" pointer-events="all" style="fill: light-dark(rgb(250, 251, 254), rgb(20, 21, 23));"/></g></g><g data-cell-id="title"><g><rect x="50" y="30" width="1500" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" font-weight="bold" text-anchor="start" font-size="42px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="50" y="80">TaskLoom · 两端四层组件图</text></g></g></g><g data-cell-id="pc"><g><rect x="40" y="130" width="970" height="815" fill="#ffffff" stroke="#416bb4" stroke-width="2" stroke-dasharray="12 8" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(65, 107, 180), rgb(115, 151, 214));"/></g><g data-cell-id="pc-title"><g><rect x="70" y="154" width="910" height="46" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#416BB4" font-family="'Microsoft YaHei'" font-weight="bold" text-anchor="start" font-size="28px" style="fill: light-dark(rgb(65, 107, 180), rgb(115, 151, 214));"><text x="70" y="190">个人端：每位用户在自己的电脑上运行</text></g></g></g><g data-cell-id="harness"><g><rect x="80" y="245" width="380" height="260" fill="#eaf0fd" stroke="#416bb4" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(234, 240, 253), rgb(27, 32, 43)); stroke: light-dark(rgb(65, 107, 180), rgb(115, 151, 214));"/></g><g data-cell-id="harness-st"><g><rect x="96" y="254" width="348" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#416BB4" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="20px" style="fill: light-dark(rgb(65, 107, 180), rgb(115, 151, 214));"><text x="270" y="276">«component»</text></g></g></g><g data-cell-id="harness-title"><g><rect x="96" y="284" width="348" height="38" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" font-weight="bold" text-anchor="middle" font-size="27px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="270" y="315.5">L2 · Harness 与任务管理</text></g></g></g><g data-cell-id="harness-body"><g><rect x="96" y="330" width="348" height="165" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="26px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="270" y="393.5">依赖图判断步骤是否就绪。</text><text x="270" y="424.5">子 Agent 继承根任务份额。</text><text x="270" y="455.5">检查点保存已确认的进度。</text></g></g></g></g><g data-cell-id="client"><g><rect x="560" y="245" width="405" height="260" fill="#fff2dd" stroke="#ad6c18" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(255, 242, 221), rgb(38, 27, 9)); stroke: light-dark(rgb(173, 108, 24), rgb(187, 131, 58));"/></g><g data-cell-id="client-st"><g><rect x="576" y="254" width="373" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#AD6C18" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="20px" style="fill: light-dark(rgb(173, 108, 24), rgb(187, 131, 58));"><text x="762.5" y="276">«component»</text></g></g></g><g data-cell-id="client-title"><g><rect x="576" y="284" width="373" height="38" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" font-weight="bold" text-anchor="middle" font-size="27px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="762.5" y="315.5">L3 · 客户端请求调度</text></g></g></g><g data-cell-id="client-body"><g><rect x="576" y="330" width="373" height="165" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="26px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="762.5" y="393.5">成本 DRR 与老化安排发送。</text><text x="762.5" y="424.5">速率、在途与预算分别校验。</text><text x="762.5" y="455.5">限速提示指导后续重试。</text></g></g></g></g><g data-cell-id="tools"><g><rect x="80" y="635" width="380" height="265" fill="#e4f4f0" stroke="#167c77" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(228, 244, 240), rgb(20, 34, 30)); stroke: light-dark(rgb(22, 124, 119), rgb(82, 169, 165));"/></g><g data-cell-id="tools-st"><g><rect x="96" y="644" width="348" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#167C77" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="20px" style="fill: light-dark(rgb(22, 124, 119), rgb(82, 169, 165));"><text x="270" y="666">«component»</text></g></g></g><g data-cell-id="tools-title"><g><rect x="96" y="674" width="348" height="38" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" font-weight="bold" text-anchor="middle" font-size="26px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="270" y="705">L1 · 本地资源与工具执行</text></g></g></g><g data-cell-id="tools-body"><g><rect x="96" y="720" width="348" height="170" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="25px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="270" y="771.5">列表调度选择可执行工具。</text><text x="270" y="801.5">原子准入统一预留资源。</text><text x="270" y="831.5">银行家检查受控阶段的安全。</text><text x="270" y="861.5">锁与 cgroup 约束实际执行。</text></g></g></g></g><g data-cell-id="support"><g><rect x="560" y="635" width="405" height="265" fill="#edf1f6" stroke="#64748b" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(237, 241, 246), rgb(28, 31, 35)); stroke: light-dark(rgb(100, 116, 139), rgb(126, 140, 159));"/></g><g data-cell-id="support-st"><g><rect x="576" y="644" width="373" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#64748B" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="20px" style="fill: light-dark(rgb(100, 116, 139), rgb(126, 140, 159));"><text x="762.5" y="666">«component»</text></g></g></g><g data-cell-id="support-title"><g><rect x="576" y="674" width="373" height="38" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" font-weight="bold" text-anchor="middle" font-size="25px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="762.5" y="704.5">共用支撑：守护、记录与界面</text></g></g></g><g data-cell-id="support-body"><g><rect x="576" y="720" width="373" height="170" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="25px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="762.5" y="786.5">独立守护进程核对资源回收。</text><text x="762.5" y="816.5">事件日志支持状态核对与恢复。</text><text x="762.5" y="846.5">界面展示等待原因及任务结果。</text></g></g></g></g></g><g data-cell-id="platform-zone"><g><rect x="1050" y="130" width="510" height="520" fill="#ffffff" stroke="#7957a7" stroke-width="2" stroke-dasharray="12 8" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(121, 87, 167), rgb(169, 140, 208));"/></g><g data-cell-id="platform-zone-title"><g><rect x="1080" y="154" width="450" height="46" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#7957A7" font-family="'Microsoft YaHei'" font-weight="bold" text-anchor="start" font-size="28px" style="fill: light-dark(rgb(121, 87, 167), rgb(169, 140, 208));"><text x="1080" y="190">平台端：协调多个用户的请求</text></g></g></g><g data-cell-id="gateway"><g><rect x="1080" y="245" width="450" height="335" fill="#f1ebfb" stroke="#7957a7" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(241, 235, 251), rgb(36, 31, 45)); stroke: light-dark(rgb(121, 87, 167), rgb(169, 140, 208));"/></g><g data-cell-id="gateway-st"><g><rect x="1096" y="254" width="418" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#7957A7" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="20px" style="fill: light-dark(rgb(121, 87, 167), rgb(169, 140, 208));"><text x="1305" y="276">«component»</text></g></g></g><g data-cell-id="gateway-title"><g><rect x="1096" y="284" width="418" height="38" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" font-weight="bold" text-anchor="middle" font-size="28px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="1305" y="316">L4 · 平台多用户请求调度</text></g></g></g><g data-cell-id="gateway-body"><g><rect x="1096" y="330" width="418" height="240" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#25364D" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="27px" style="fill: light-dark(rgb(37, 54, 77), rgb(180, 194, 214));"><text x="1305" y="398.5">先在用户间分配服务份额，</text><text x="1305" y="430.5">再按根任务进行成本轮转。</text><text x="1305" y="462.5">有界队列控制请求积压。</text><text x="1305" y="494.5">平台反馈拥塞与等待状态。</text><text x="1305" y="526.5">共享上游额度由平台裁决。</text></g></g></g></g></g><g data-cell-id="model"><g><rect x="1090" y="755" width="450" height="170" fill="#edf1f6" stroke="#64748b" stroke-width="2" pointer-events="all" style="fill: light-dark(rgb(237, 241, 246), rgb(28, 31, 35)); stroke: light-dark(rgb(100, 116, 139), rgb(126, 140, 159));"/></g><g data-cell-id="model-st"><g><rect x="1106" y="764" width="418" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#64748B" font-family="'Microsoft YaHei'" text-anchor="middle" font-size="20px" style=